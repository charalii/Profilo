services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hirescope
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/hirescope
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Demo JWT + /api/dev/* scrape helpers (never enable in production)
      HIRESCOPE_DEV: ${HIRESCOPE_DEV:-0}
    depends_on:
      - db
      - redis

  celery-worker:
    build: ./backend
    command: celery -A backend.tasks.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/hirescope
      REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      - db
      - redis

  celery-beat:
    build: ./backend
    command: celery -A backend.tasks.celery_app beat --loglevel=info
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
      NEXT_PUBLIC_HIRESCOPE_DEV: ${NEXT_PUBLIC_HIRESCOPE_DEV:-0}
    depends_on:
      - backend

volumes:
  postgres_data:
